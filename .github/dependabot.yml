version: 2

updates:
  # Compose and AGP move quickly, and this library sits close enough to the graphics internals
  # that a version bump can change how effects behave. Monthly, so it is a deliberate review
  # rather than a stream of noise.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
