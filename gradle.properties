## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Fri Jul 31 02:08:13 CEST 2026
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# Memory, tuned for a 16 GB machine running Android Studio alongside. An app that includes this
# build shares one daemon with it only with the same Gradle version, the same daemon JDK
# (gradle-daemon-jvm.properties) and these exact arguments; otherwise Gradle starts a second one.
# Kotlin compiles inside this daemon instead of in a JVM of its own, so the heap carries it.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding\=UTF-8
# Six workers keep peak memory in check; all sixteen threads compiling at once outgrow the heap.
org.gradle.workers.max=6
# An idle daemon gives its memory back after 30 minutes rather than the default three hours.
org.gradle.daemon.idletimeout=1800000
